<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartographie des sites</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

<style>
  :root{
    --bg:#0f1620;
    --panel:#f3f5f7;
    --panel-border:#d8dee3;
    --text:#1c2530;
    --muted:#65707c;
    --accent:#1f6feb;
    --accent-soft:#eaf1fd;
    --radius:10px;
    --shadow:0 4px 16px rgba(15,22,32,.12);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);
    background:var(--bg);
  }
  #app{
    display:flex;
    height:100vh;
    width:100vw;
    overflow:hidden;
  }

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:340px;
    min-width:340px;
    background:var(--panel);
    border-right:1px solid var(--panel-border);
    display:flex;
    flex-direction:column;
    z-index:1000;
    box-shadow:var(--shadow);
  }
  #sidebar-header{
    padding:18px 18px 12px 18px;
    border-bottom:1px solid var(--panel-border);
  }
  #sidebar-header h1{
    font-size:17px;
    margin:0 0 4px 0;
    font-weight:700;
    letter-spacing:-.2px;
  }
  #sidebar-header p{
    margin:0;
    font-size:12.5px;
    color:var(--muted);
  }
  #count-badge{
    display:inline-block;
    margin-top:10px;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:12.5px;
    font-weight:600;
    padding:4px 10px;
    border-radius:100px;
  }
  #sidebar-scroll{
    flex:1;
    overflow-y:auto;
    padding:14px 18px 18px 18px;
  }
  .filter-block{
    margin-bottom:18px;
  }
  .filter-block h2{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.6px;
    color:var(--muted);
    margin:0 0 8px 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .filter-block h2 .mini-link{
    text-transform:none;
    letter-spacing:0;
    font-size:11.5px;
    color:var(--accent);
    cursor:pointer;
    font-weight:600;
  }
  input[type="search"]{
    width:100%;
    padding:9px 12px;
    border:1px solid var(--panel-border);
    border-radius:8px;
    font-size:13.5px;
    outline:none;
    background:#ffffff;
  }
  input[type="search"]:focus{
    border-color:var(--accent);
    background:#fff;
  }
  .check-list{
    max-height:230px;
    overflow-y:auto;
    border:1px solid var(--panel-border);
    border-radius:8px;
    padding:4px 2px;
    background:#ffffff;
  }
  .check-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 8px;
    font-size:13px;
    border-radius:6px;
    cursor:pointer;
    user-select:none;
  }
  .check-row:hover{
    background:#e9edf0;
  }
  .check-row input{
    accent-color: var(--accent);
    width:14px;height:14px;
    flex:none;
  }
  .swatch{
    width:34px;height:34px;
    border-radius:7px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    line-height:1;
    background:#eef1f4;
    box-shadow:0 0 0 1px rgba(0,0,0,.1) inset;
  }
  .check-row .lbl{
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .check-row .n{
    color:var(--muted);
    font-size:11.5px;
    flex:none;
  }
  .toggle-row{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:13px;
    padding:5px 2px;
    cursor:pointer;
  }
  .toggle-row + .toggle-row{
    margin-top:2px;
  }
  .toggle-row input{
    accent-color: var(--accent);
    width:15px;height:15px;
  }
  #reset-btn{
    width:100%;
    padding:9px;
    border-radius:8px;
    border:1px solid var(--panel-border);
    background:#ffffff;
    color:var(--text);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  #reset-btn:hover{
    background:#e9edf0;
  }
  #export-btn{
    width:100%;
    margin-top:8px;
    padding:9px;
    border-radius:8px;
    border:1px solid var(--accent);
    background:var(--accent-soft);
    color:var(--accent);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  #export-btn:hover{
    background:var(--accent);
    color:#fff;
  }

  /* ---------- Map ---------- */
  #map-wrap{
    flex:1;
    position:relative;
  }
  #map{
    height:100%;
    width:100%;
    background:#dfe7ee;
  }
  #mobile-toggle{
    display:none;
  }

  .leaflet-popup-content{
    font-size:13px;
    line-height:1.5;
    min-width:220px;
  }
  .popup-title{
    font-weight:700;
    font-size:13.5px;
    margin-bottom:4px;
  }
  .popup-row{
    color:#3a4551;
  }
  .popup-row b{
    color:#1c2530;
  }
  .popup-tag{
    display:inline-block;
    margin-top:6px;
    padding:3px 9px;
    border-radius:100px;
    font-size:11px;
    font-weight:600;
    color:#1c2530;
    background:#eef1f4;
  }
  .popup-closed{
    color:#b34700;
    font-weight:600;
    font-size:11.5px;
    margin-top:4px;
    display:inline-block;
  }

  /* Meilleure lisibilité des bulles de regroupement (clusters) sur fond satellite */
  .marker-cluster div{
    box-shadow: 0 0 0 2.5px rgba(255,255,255,.95), 0 2px 6px rgba(0,0,0,.5);
  }

  /* Curseur "main" jaune, sans cercle ni anneau */
  .leaflet-container.leaflet-grab,
  .leaflet-container .leaflet-grab{
    cursor: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMiIgaGVpZ2h0PSIzMiIgdmlld0JveD0iMCAwIDMyIDMyIj4KPHRleHQgeD0iMTYiIHk9IjI0IiBmb250LXNpemU9IjI2IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj7inIs8L3RleHQ+Cjwvc3ZnPg==') 16 16, grab !important;
  }
  .leaflet-container.leaflet-grabbing,
  .leaflet-container .leaflet-grabbing{
    cursor: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMiIgaGVpZ2h0PSIzMiIgdmlld0JveD0iMCAwIDMyIDMyIj4KPHRleHQgeD0iMTYiIHk9IjI0IiBmb250LXNpemU9IjI2IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj7inIo8L3RleHQ+Cjwvc3ZnPg==') 16 16, grabbing !important;
  }

  /* scrollbars : contraste renforcé pour une meilleure visibilité */
  #sidebar-scroll, .check-list{
    scrollbar-width: auto;
    scrollbar-color: #8b97a3 #e4e8ec;
  }
  #sidebar-scroll::-webkit-scrollbar, .check-list::-webkit-scrollbar{
    width:10px;
  }
  #sidebar-scroll::-webkit-scrollbar-track, .check-list::-webkit-scrollbar-track{
    background:#e4e8ec;
    border-radius:10px;
  }
  #sidebar-scroll::-webkit-scrollbar-thumb, .check-list::-webkit-scrollbar-thumb{
    background:#8b97a3;
    border-radius:10px;
    border:2px solid #e4e8ec;
  }
  #sidebar-scroll::-webkit-scrollbar-thumb:hover, .check-list::-webkit-scrollbar-thumb:hover{
    background:#6b7683;
  }

  @media (max-width:1024px){
    /* Tablette et téléphone : le panneau de filtres devient un tiroir */
    #sidebar{
      position:fixed;
      top:0;left:0;bottom:0;
      transform:translateX(-100%);
      transition:transform .25s ease;
      width:min(400px, 88vw);
      min-width:0;
    }
    #sidebar.open{
      transform:translateX(0);
    }
    #mobile-toggle{
      display:flex;
      position:absolute;
      top:12px;left:12px;
      z-index:1001;
      background:var(--accent);
      color:#fff;
      border:none;
      border-radius:8px;
      padding:10px 14px;
      font-size:14px;
      font-weight:700;
      box-shadow:0 3px 10px rgba(15,22,32,.35);
      align-items:center;
      gap:6px;
      cursor:pointer;
    }
    #sidebar-backdrop{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(15,22,32,.35);
      z-index:999;
    }
    #sidebar-backdrop.show{display:block;}

    /* cibles tactiles agrandies */
    .check-row{ padding:9px 8px; }
    .check-row input{ width:18px;height:18px; }
    .toggle-row{ padding:8px 2px; }
    .toggle-row input{ width:19px;height:19px; }
    .check-list{ max-height:210px; }
    #reset-btn{ padding:12px; font-size:14px; }

    .leaflet-control-layers{ font-size:13.5px; }
    .leaflet-control-layers-toggle{ width:38px !important; height:38px !important; }

    /* Les contrôles (fond de carte, zoom) descendus pour ne pas coller au bord */
    .leaflet-top.leaflet-right{
      top:64px;
    }
  }

  @media (max-width:640px){
    #sidebar{ width:92vw; }
    #sidebar-header{ padding:15px 16px 10px 16px; }
    #sidebar-header h1{ font-size:16px; }
    #sidebar-header p{ font-size:12px; }
    #count-badge{ font-size:12px; }
    #sidebar-scroll{ padding:12px 16px 16px 16px; }
    #mobile-toggle{ top:10px; left:10px; padding:10px 14px; font-size:13.5px; }

    .leaflet-top.leaflet-right{
      top:70px;
    }

    .leaflet-popup-content{
      min-width:0;
      max-width:64vw;
      font-size:12.5px;
    }
    .popup-title{ font-size:13px; }
    .popup-tag{ font-size:10.5px; padding:3px 8px; }
  }

  @media (max-width:380px){
    #sidebar{ width:96vw; }
    .leaflet-popup-content{ max-width:58vw; }
  }
</style>
</head>
<body>

<div id="app">

  <div id="sidebar-backdrop" onclick="closeSidebar()"></div>

  <div id="sidebar">
    <div id="sidebar-header">
      <h1>Cartographie des sites</h1>
      <p>Entités, villes et CASI &mdash; données du fichier Excel</p>
      <span id="count-badge">893 sites affichés</span>
    </div>
    <div id="sidebar-scroll">

      <div class="filter-block">
        <h2>Recherche</h2>
        <input type="search" id="search-input" placeholder="Nom du site ou ville...">
      </div>

      <div class="filter-block">
        <h2>Type d'entité <span class="mini-link" id="type-clear">tout / rien</span></h2>
        <div class="check-list" id="type-list"></div>
      </div>

      <div class="filter-block">
        <h2>CASI <span class="mini-link" id="casi-clear">tout / rien</span></h2>
        <div class="check-list" id="casi-list"></div>
      </div>

      <div class="filter-block">
        <h2>DIT <span class="mini-link" id="dit-clear">tout / rien</span></h2>
        <div class="check-list" id="dit-list"></div>
      </div>

      <div class="filter-block">
        <h2>Statut d'activité</h2>
        <label class="toggle-row">
          <input type="checkbox" id="active-toggle" checked>
          IST actives (sans date de fin d'activité)
        </label>
        <label class="toggle-row">
          <input type="checkbox" id="closed-toggle" checked>
          Site avec date fin d'activité
        </label>
      </div>

      <button id="reset-btn">Réinitialiser les filtres</button>
      <button id="export-btn">📥 Exporter les sites affichés (.xlsx)</button>
    </div>
  </div>

  <div id="map-wrap">
    <div id="mobile-toggle" onclick="toggleSidebar()">☰ Filtres</div>
    <div id="map"></div>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <input type="checkbox" data-kind="type" data-val="${encodeURIComponent(t)}" checked>
    <span class="swatch">${iconForType(t)}</span>
    <span class="lbl">${t.charAt(0) + t.slice(1).toLowerCase()}</span>
    <span class="n">${countByType(t)}</span>
  `;
  typeListEl.appendChild(row);
});

const casiListEl = document.getElementById('casi-list');
CASIS.forEach(c => {
  const row = document.createElement('label');
  row.className = 'check-row';
  row.innerHTML = `
    <input type="checkbox" data-kind="casi" data-val="${encodeURIComponent(c)}" checked>
    <span class="lbl">${c}</span>
    <span class="n">${countByCasi(c)}</span>
  `;
  casiListEl.appendChild(row);
});

const ditListEl = document.getElementById('dit-list');
DITS.forEach(d => {
  const row = document.createElement('label');
  row.className = 'check-row';
  row.innerHTML = `
    <input type="checkbox" data-kind="dit" data-val="${encodeURIComponent(d)}" checked>
    <span class="lbl">${d}</span>
    <span class="n">${countByDit(d)}</span>
  `;
  ditListEl.appendChild(row);
});

/* ============ CARTE ============ */
const map = L.map('map', { zoomControl: false }).setView([46.6, 2.3], 6);

const planLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
});

const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19,
  attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community'
});

planLayer.addTo(map);

L.control.layers(
  { "Plan": planLayer, "Satellite": satelliteLayer },
  null,
  { position: 'topright', collapsed: true }
).addTo(map);

L.control.zoom({ position: 'topright' }).addTo(map);

const clusterGroup = L.markerClusterGroup({
  showCoverageOnHover: false,
  maxClusterRadius: 45
});
map.addLayer(clusterGroup);

function makeIcon(type, closed){
  const glyph = iconForType(type);
  if (closed){
    return L.divIcon({
      className: '',
      html: `<div style="
          width:36px;height:36px;border-radius:50%;
          background:#e0392b;
          border:2.5px solid #8f1d13;
          box-shadow:0 0 0 3px rgba(255,255,255,.95), 0 2px 7px rgba(0,0,0,.55);
          display:flex;align-items:center;justify-content:center;
          font-size:19px;line-height:1;
        ">${glyph}</div>`,
      iconSize: [36,36],
      iconAnchor: [18,18],
      popupAnchor: [0,-18]
    });
  }
  /* Site actif : icône seule, sans cercle, avec un léger halo blanc pour rester lisible sur tous les fonds */
  return L.divIcon({
    className: '',
    html: `<div style="
        width:36px;height:36px;
        display:flex;align-items:center;justify-content:center;
        font-size:28px;line-height:1;
        filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 2px #fff) drop-shadow(0 1px 3px rgba(0,0,0,.5));
      ">${glyph}</div>`,
    iconSize: [36,36],
    iconAnchor: [18,18],
    popupAnchor: [0,-16]
  });
}

const markers = SITES.map(site => {
  const marker = L.marker([site.lat, site.lng], { icon: makeIcon(site.type, site.cloture) });
  const closedTag = site.cloture
    ? `<div class="popup-closed">⚠ Site clôturé${site.date_fin ? ' le ' + escapeHtml(site.date_fin) : ''}</div>`
    : '';
  const surfaces = [];
  if (site.surf_terrain) surfaces.push(`Terrain : ${site.surf_terrain} m²`);
  if (site.surf_bat) surfaces.push(`Bâtiment : ${site.surf_bat} m²`);
  const surfacesRow = surfaces.length
    ? `<div class="popup-row"><b>Surface de convention :</b> ${surfaces.join(' — ')}</div>`
    : '';
  marker.bindPopup(`
    <div class="popup-title">${escapeHtml(site.nom)}</div>
    <div class="popup-row"><b>Ville :</b> ${escapeHtml(site.ville)}${site.cp ? ' ('+site.cp+')' : ''}</div>
    <div class="popup-row"><b>Région :</b> ${escapeHtml(site.region || '—')}</div>
    <div class="popup-row"><b>CASI :</b> ${escapeHtml(site.casi)}</div>
    ${surfacesRow}
    <span class="popup-tag">${iconForType(site.type)} ${escapeHtml(site.type)}</span>
    ${closedTag}
  `, { maxWidth: 280, minWidth: 190, autoPanPadding: [20, 20] });
  marker.siteData = site;
  return marker;
});

function escapeHtml(str){
  if (!str) return '';
  return String(str)
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;');
}

/* ============ FILTRAGE ============ */
function applyFilters(fitMap){
  clusterGroup.clearLayers();
  const q = state.search.trim().toLowerCase();
  let visible = 0;

  const toAdd = [];
  markers.forEach(m => {
    const s = m.siteData;
    if (!state.types.has(s.type)) return;
    if (!state.casis.has(s.casi)) return;
    if (!state.dits.has(s.dit)) return;
    if (s.cloture && !state.includeClosed) return;
    if (!s.cloture && !state.includeActive) return;
    if (q){
      const hay = (s.nom + ' ' + s.ville + ' ' + (s.cp||'')).toLowerCase();
      if (!hay.includes(q)) return;
    }
    toAdd.push(m);
    visible++;
  });
  clusterGroup.addLayers(toAdd);
  visibleMarkers = toAdd;

  document.getElementById('count-badge').textContent =
    `${visible} site${visible>1?'s':''} affiché${visible>1?'s':''} / ${SITES.length}`;

  if (fitMap && toAdd.length > 0){
    const bounds = L.latLngBounds(toAdd.map(m => m.getLatLng()));
    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 12 });
  }
}

/* ============ EXPORT EXCEL (.xlsx) ============ */
function exportXLSX(){
  const headers = [
    "Nom de l'entité", "Type d'entité", "CASI", "DIT", "Ville", "Code postal",
    "Région", "Statut", "Date fin d'activité",
    "Surface terrain (m²)", "Surface bâtiment (m²)", "Latitude", "Longitude"
  ];
  const rows = visibleMarkers.map(m => {
    const s = m.siteData;
    return [
      s.nom, s.type, s.casi, s.dit, s.ville, s.cp, s.region,
      s.cloture ? 'Clôturé' : 'Actif',
      s.date_fin || '',
      s.surf_terrain || '', s.surf_bat || '',
      s.lat, s.lng
    ];
  });

  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  ws['!cols'] = [
    {wch:32},{wch:26},{wch:22},{wch:20},{wch:20},{wch:10},
    {wch:20},{wch:10},{wch:14},{wch:14},{wch:16},{wch:10},{wch:10}
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Sites");

  const date = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `sites_carto_ist_${date}.xlsx`);
}

/* ============ EVENEMENTS UI ============ */
document.getElementById('search-input').addEventListener('input', e => {
  state.search = e.target.value;
  applyFilters();
});

document.querySelectorAll('input[data-kind="type"]').forEach(cb => {
  cb.addEventListener('change', () => {
    const val = decodeURIComponent(cb.dataset.val);
    if (cb.checked) state.types.add(val); else state.types.delete(val);
    applyFilters();
  });
});
document.querySelectorAll('input[data-kind="casi"]').forEach(cb => {
  cb.addEventListener('change', () => {
    const val = decodeURIComponent(cb.dataset.val);
    if (cb.checked) state.casis.add(val); else state.casis.delete(val);
    applyFilters(true);
  });
});
document.querySelectorAll('input[data-kind="dit"]').forEach(cb => {
  cb.addEventListener('change', () => {
    const val = decodeURIComponent(cb.dataset.val);
    if (cb.checked) state.dits.add(val); else state.dits.delete(val);
    applyFilters(true);
  });
});

document.getElementById('active-toggle').addEventListener('change', e => {
  state.includeActive = e.target.checked;
  applyFilters();
});
document.getElementById('closed-toggle').addEventListener('change', e => {
  state.includeClosed = e.target.checked;
  applyFilters();
});

let typeAllOn = true;
document.getElementById('type-clear').addEventListener('click', () => {
  typeAllOn = !typeAllOn;
  document.querySelectorAll('input[data-kind="type"]').forEach(cb => cb.checked = typeAllOn);
  state.types = typeAllOn ? new Set(TYPES) : new Set();
  applyFilters();
});
let casiAllOn = true;
document.getElementById('casi-clear').addEventListener('click', () => {
  casiAllOn = !casiAllOn;
  document.querySelectorAll('input[data-kind="casi"]').forEach(cb => cb.checked = casiAllOn);
  state.casis = casiAllOn ? new Set(CASIS) : new Set();
  applyFilters(true);
});
let ditAllOn = true;
document.getElementById('dit-clear').addEventListener('click', () => {
  ditAllOn = !ditAllOn;
  document.querySelectorAll('input[data-kind="dit"]').forEach(cb => cb.checked = ditAllOn);
  state.dits = ditAllOn ? new Set(DITS) : new Set();
  applyFilters(true);
});

document.getElementById('reset-btn').addEventListener('click', () => {
  state.search = '';
  state.types = new Set(TYPES);
  state.casis = new Set(CASIS);
  state.dits = new Set(DITS);
  state.includeClosed = true;
  state.includeActive = true;
  typeAllOn = true; casiAllOn = true; ditAllOn = true;
  document.getElementById('search-input').value = '';
  document.getElementById('closed-toggle').checked = true;
  document.getElementById('active-toggle').checked = true;
  document.querySelectorAll('input[data-kind]').forEach(cb => cb.checked = true);
  applyFilters();
  map.setView([46.6, 2.3], 6);
});

document.getElementById('export-btn').addEventListener('click', exportXLSX);

/* ============ SIDEBAR MOBILE ============ */
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-backdrop').classList.toggle('show');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-backdrop').classList.remove('show');
}

applyFilters();
</script>
