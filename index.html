<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartographie des sites</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

<style>
  :root{
    --bg:#0f1620;
    --panel:#ffffff;
    --panel-border:#e2e6ea;
    --text:#1c2530;
    --muted:#65707c;
    --accent:#1f6feb;
    --accent-soft:#eaf1fd;
    --radius:10px;
    --shadow:0 4px 16px rgba(15,22,32,.12);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text);
    background:var(--bg);
  }
  #app{
    display:flex;
    height:100vh;
    width:100vw;
    overflow:hidden;
  }

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:340px;
    min-width:340px;
    background:var(--panel);
    border-right:1px solid var(--panel-border);
    display:flex;
    flex-direction:column;
    z-index:1000;
    box-shadow:var(--shadow);
  }
  #sidebar-header{
    padding:18px 18px 12px 18px;
    border-bottom:1px solid var(--panel-border);
  }
  #sidebar-header h1{
    font-size:17px;
    margin:0 0 4px 0;
    font-weight:700;
    letter-spacing:-.2px;
  }
  #sidebar-header p{
    margin:0;
    font-size:12.5px;
    color:var(--muted);
  }
  #count-badge{
    display:inline-block;
    margin-top:10px;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:12.5px;
    font-weight:600;
    padding:4px 10px;
    border-radius:100px;
  }
  #sidebar-scroll{
    flex:1;
    overflow-y:auto;
    padding:14px 18px 18px 18px;
  }
  .filter-block{
    margin-bottom:18px;
  }
  .filter-block h2{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.6px;
    color:var(--muted);
    margin:0 0 8px 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .filter-block h2 .mini-link{
    text-transform:none;
    letter-spacing:0;
    font-size:11.5px;
    color:var(--accent);
    cursor:pointer;
    font-weight:600;
  }
  input[type="search"]{
    width:100%;
    padding:9px 12px;
    border:1px solid var(--panel-border);
    border-radius:8px;
    font-size:13.5px;
    outline:none;
    background:#f7f9fb;
  }
  input[type="search"]:focus{
    border-color:var(--accent);
    background:#fff;
  }
  .check-list{
    max-height:230px;
    overflow-y:auto;
    border:1px solid var(--panel-border);
    border-radius:8px;
    padding:4px 2px;
  }
  .check-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 8px;
    font-size:13px;
    border-radius:6px;
    cursor:pointer;
    user-select:none;
  }
  .check-row:hover{
    background:#f4f6f8;
  }
  .check-row input{
    accent-color: var(--accent);
    width:14px;height:14px;
    flex:none;
  }
  .swatch{
    width:11px;height:11px;
    border-radius:3px;
    flex:none;
    box-shadow:0 0 0 1px rgba(0,0,0,.15) inset;
  }
  .check-row .lbl{
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .check-row .n{
    color:var(--muted);
    font-size:11.5px;
    flex:none;
  }
  .toggle-row{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:13px;
    padding:4px 2px;
    cursor:pointer;
  }
  .toggle-row input{
    accent-color: var(--accent);
    width:15px;height:15px;
  }
  #reset-btn{
    width:100%;
    padding:9px;
    border-radius:8px;
    border:1px solid var(--panel-border);
    background:#f7f9fb;
    color:var(--text);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  #reset-btn:hover{
    background:#eef1f4;
  }

  /* ---------- Map ---------- */
  #map-wrap{
    flex:1;
    position:relative;
  }
  #map{
    height:100%;
    width:100%;
    background:#dfe7ee;
  }
  #mobile-toggle{
    display:none;
  }

  .leaflet-popup-content{
    font-size:13px;
    line-height:1.5;
    min-width:220px;
  }
  .popup-title{
    font-weight:700;
    font-size:13.5px;
    margin-bottom:4px;
  }
  .popup-row{
    color:#3a4551;
  }
  .popup-row b{
    color:#1c2530;
  }
  .popup-tag{
    display:inline-block;
    margin-top:6px;
    padding:2px 8px;
    border-radius:100px;
    font-size:11px;
    font-weight:600;
    color:#fff;
  }
  .popup-closed{
    color:#b34700;
    font-weight:600;
    font-size:11.5px;
    margin-top:4px;
    display:inline-block;
  }

  /* scrollbars */
  #sidebar-scroll::-webkit-scrollbar, .check-list::-webkit-scrollbar{width:7px;}
  #sidebar-scroll::-webkit-scrollbar-thumb, .check-list::-webkit-scrollbar-thumb{
    background:#cfd6dc;border-radius:10px;
  }

  @media (max-width:820px){
    #sidebar{
      position:fixed;
      top:0;left:0;bottom:0;
      transform:translateX(-100%);
      transition:transform .25s ease;
      width:86vw;
      min-width:0;
    }
    #sidebar.open{
      transform:translateX(0);
    }
    #mobile-toggle{
      display:flex;
      position:absolute;
      top:12px;left:12px;
      z-index:1001;
      background:#fff;
      border:1px solid var(--panel-border);
      border-radius:8px;
      padding:9px 12px;
      font-size:13px;
      font-weight:700;
      box-shadow:var(--shadow);
      align-items:center;
      gap:6px;
      cursor:pointer;
    }
    #sidebar-backdrop{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(15,22,32,.35);
      z-index:999;
    }
    #sidebar-backdrop.show{display:block;}
  }
</style>
</head>
<body>

<div id="app">

  <div id="sidebar-backdrop" onclick="closeSidebar()"></div>

  <div id="sidebar">
    <div id="sidebar-header">
      <h1>Cartographie des sites</h1>
      <p>Entités, villes et CASI &mdash; données du fichier Excel</p>
      <span id="count-badge">893 sites affichés</span>
    </div>
    <div id="sidebar-scroll">

      <div class="filter-block">
        <h2>Recherche</h2>
        <input type="search" id="search-input" placeholder="Nom du site ou ville...">
      </div>

      <div class="filter-block">
        <h2>Type d'entité <span class="mini-link" id="type-clear">tout / rien</span></h2>
        <div class="check-list" id="type-list"></div>
      </div>

      <div class="filter-block">
        <h2>CASI <span class="mini-link" id="casi-clear">tout / rien</span></h2>
        <div class="check-list" id="casi-list"></div>
      </div>

      <div class="filter-block">
        <label class="toggle-row">
          <input type="checkbox" id="closed-toggle">
          Inclure les sites clôturés
        </label>
      </div>

      <button id="reset-btn">Réinitialiser les filtres</button>
    </div>
  </div>

  <div id="map-wrap">
    <div id="mobile-toggle" onclick="toggleSidebar()">☰ Filtres</div>
    <div id="map"></div>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

/* ============ COULEURS PAR TYPE ============ */
const TYPES = [...new Set(SITES.map(s => s.type))].sort();
const CASIS = [...new Set(SITES.map(s => s.casi))].sort();

function colorForIndex(i, total){
  const hue = Math.round((360 * i) / total);
  return `hsl(${hue}, 68%, 45%)`;
}
const TYPE_COLORS = {};
TYPES.forEach((t,i) => TYPE_COLORS[t] = colorForIndex(i, TYPES.length));

/* ============ ETAT DES FILTRES ============ */
const state = {
  search: '',
  types: new Set(TYPES),
  casis: new Set(CASIS),
  includeClosed: false
};

/* ============ CONSTRUCTION SIDEBAR ============ */
function countByType(t){ return SITES.filter(s => s.type === t).length; }
function countByCasi(c){ return SITES.filter(s => s.casi === c).length; }

const typeListEl = document.getElementById('type-list');
TYPES.forEach(t => {
  const row = document.createElement('label');
  row.className = 'check-row';
  row.innerHTML = `
    <input type="checkbox" data-kind="type" data-val="${encodeURIComponent(t)}" checked>
    <span class="swatch" style="background:${TYPE_COLORS[t]}"></span>
    <span class="lbl">${t.charAt(0) + t.slice(1).toLowerCase()}</span>
    <span class="n">${countByType(t)}</span>
  `;
  typeListEl.appendChild(row);
});

const casiListEl = document.getElementById('casi-list');
CASIS.forEach(c => {
  const row = document.createElement('label');
  row.className = 'check-row';
  row.innerHTML = `
    <input type="checkbox" data-kind="casi" data-val="${encodeURIComponent(c)}" checked>
    <span class="lbl">${c}</span>
    <span class="n">${countByCasi(c)}</span>
  `;
  casiListEl.appendChild(row);
});

/* ============ CARTE ============ */
const map = L.map('map', { zoomControl: true }).setView([46.6, 2.3], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

const clusterGroup = L.markerClusterGroup({
  showCoverageOnHover: false,
  maxClusterRadius: 45
});
map.addLayer(clusterGroup);

function makeIcon(type){
  const color = TYPE_COLORS[type] || '#555';
  return L.divIcon({
    className: '',
    html: `<div style="
        width:16px;height:16px;border-radius:50%;
        background:${color};
        border:2px solid #fff;
        box-shadow:0 0 0 1px rgba(0,0,0,.35);
      "></div>`,
    iconSize: [16,16],
    iconAnchor: [8,8],
    popupAnchor: [0,-8]
  });
}

const markers = SITES.map(site => {
  const marker = L.marker([site.lat, site.lng], { icon: makeIcon(site.type) });
  const closedTag = site.cloture ? `<div class="popup-closed">⚠ Site clôturé</div>` : '';
  marker.bindPopup(`
    <div class="popup-title">${escapeHtml(site.nom)}</div>
    <div class="popup-row"><b>Ville :</b> ${escapeHtml(site.ville)}${site.cp ? ' ('+site.cp+')' : ''}</div>
    <div class="popup-row"><b>Région :</b> ${escapeHtml(site.region || '—')}</div>
    <div class="popup-row"><b>CASI :</b> ${escapeHtml(site.casi)}</div>
    <span class="popup-tag" style="background:${TYPE_COLORS[site.type]}">${escapeHtml(site.type)}</span>
    ${closedTag}
  `);
  marker.siteData = site;
  return marker;
});

function escapeHtml(str){
  if (!str) return '';
  return String(str)
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;');
}

/* ============ FILTRAGE ============ */
function applyFilters(){
  clusterGroup.clearLayers();
  const q = state.search.trim().toLowerCase();
  let visible = 0;

  const toAdd = [];
  markers.forEach(m => {
    const s = m.siteData;
    if (!state.types.has(s.type)) return;
    if (!state.casis.has(s.casi)) return;
    if (!state.includeClosed && s.cloture) return;
    if (q){
      const hay = (s.nom + ' ' + s.ville + ' ' + (s.cp||'')).toLowerCase();
      if (!hay.includes(q)) return;
    }
    toAdd.push(m);
    visible++;
  });
  clusterGroup.addLayers(toAdd);

  document.getElementById('count-badge').textContent =
    `${visible} site${visible>1?'s':''} affiché${visible>1?'s':''} / ${SITES.length}`;
}

/* ============ EVENEMENTS UI ============ */
document.getElementById('search-input').addEventListener('input', e => {
  state.search = e.target.value;
  applyFilters();
});

document.querySelectorAll('input[data-kind="type"]').forEach(cb => {
  cb.addEventListener('change', () => {
    const val = decodeURIComponent(cb.dataset.val);
    if (cb.checked) state.types.add(val); else state.types.delete(val);
    applyFilters();
  });
});
document.querySelectorAll('input[data-kind="casi"]').forEach(cb => {
  cb.addEventListener('change', () => {
    const val = decodeURIComponent(cb.dataset.val);
    if (cb.checked) state.casis.add(val); else state.casis.delete(val);
    applyFilters();
  });
});

document.getElementById('closed-toggle').addEventListener('change', e => {
  state.includeClosed = e.target.checked;
  applyFilters();
});

let typeAllOn = true;
document.getElementById('type-clear').addEventListener('click', () => {
  typeAllOn = !typeAllOn;
  document.querySelectorAll('input[data-kind="type"]').forEach(cb => cb.checked = typeAllOn);
  state.types = typeAllOn ? new Set(TYPES) : new Set();
  applyFilters();
});
let casiAllOn = true;
document.getElementById('casi-clear').addEventListener('click', () => {
  casiAllOn = !casiAllOn;
  document.querySelectorAll('input[data-kind="casi"]').forEach(cb => cb.checked = casiAllOn);
  state.casis = casiAllOn ? new Set(CASIS) : new Set();
  applyFilters();
});

document.getElementById('reset-btn').addEventListener('click', () => {
  state.search = '';
  state.types = new Set(TYPES);
  state.casis = new Set(CASIS);
  state.includeClosed = false;
  typeAllOn = true; casiAllOn = true;
  document.getElementById('search-input').value = '';
  document.getElementById('closed-toggle').checked = false;
  document.querySelectorAll('input[data-kind]').forEach(cb => cb.checked = true);
  applyFilters();
});

/* ============ SIDEBAR MOBILE ============ */
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-backdrop').classList.toggle('show');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-backdrop').classList.remove('show');
}

applyFilters();
</script>

</body>
</html>
